<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing Admin | Pep Suppliers</title>
<style>
:root{--navy:#071833;--teal:#0D6D72;--border:#e2ecf0;--bg:#f7fafc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--navy)}

#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#fff;border-radius:16px;border:1px solid var(--border);padding:48px 40px;width:360px;text-align:center;box-shadow:0 4px 24px rgba(7,24,51,.10)}
.login-box h1{font-size:22px;margin-bottom:8px}
.login-box p{color:#6b7f94;font-size:14px;margin-bottom:24px}
.login-box input[type=password]{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:10px;font-size:15px;margin-bottom:12px;outline:none}
.login-box input[type=password]:focus{border-color:var(--teal)}
.login-box button{width:100%;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.login-error{color:#c0392b;font-size:13px;margin-top:8px;display:none}

#admin-screen{display:none;min-height:100vh}
.admin-header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.admin-header h1{font-size:17px;font-weight:900}

.toolbar{display:flex;align-items:center;gap:8px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.toolbar input[type=search]{width:160px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none}
.toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;outline:none;cursor:pointer}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;white-space:nowrap}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:#0a5a5f}
.btn-primary:disabled{background:#9aabb8;cursor:not-allowed}
.btn-secondary{background:#fff;color:var(--navy);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:#fff;color:#c0392b;border:1px solid #f5c6cb}
.toolbar-divider{width:1px;height:26px;background:var(--border);flex-shrink:0}
.markup-group{display:flex;align-items:center;gap:6px;background:#fffbe6;border:1px solid #f0e68c;border-radius:8px;padding:5px 10px}
.markup-group label{font-size:12px;font-weight:700;color:#856404;white-space:nowrap}
.markup-group input[type=number]{width:64px;padding:5px 8px;border:1px solid #f0e68c;border-radius:6px;font-size:13px;font-weight:700;text-align:center;outline:none;background:#fff}
.markup-group input:focus{border-color:var(--teal)}

.status-bar{padding:9px 24px;font-size:13px;font-weight:600;display:none}
.status-bar.success{background:#d4edda;color:#155724;display:block}
.status-bar.error{background:#f8d7da;color:#721c24;display:block}
.status-bar.loading{background:#d1ecf1;color:#0c5460;display:block}

.table-wrap{padding:20px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border);font-size:13px}
thead tr{background:var(--navy);color:#fff}
thead th{padding:10px 11px;text-align:left;font-weight:700;white-space:nowrap}
tbody tr:nth-child(even){background:#f7fafc}
tbody tr:hover{background:#EEF8FA}
tbody td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:middle}

/* Product group header row */
tr.product-header td{background:#e8f4f8;font-weight:700;border-top:2px solid var(--teal);padding:6px 11px}
tr.product-header td:first-child{color:var(--teal)}

tr.size-row td{padding:6px 11px}
tr.size-row.changed-row{background:#fffbe6!important}
tr.size-row.changed-row td:first-child{border-left:3px solid #f0a500}

.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}
.badge-weight{background:#fce7f3;color:#9d174d}
.badge-gh{background:#d1fae5;color:#065f46}
.badge-healing{background:#dbeafe;color:#1e40af}
.badge-blends{background:#ede9fe;color:#5b21b6}
.badge-other{background:#f3f4f6;color:#374151}

.price-input{width:100px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;text-align:right;outline:none;font-family:monospace}
.price-input:focus{border-color:var(--teal)}
.price-input.changed{border-color:#f0a500;background:#fffbe6}
.cost-cell{color:#9aabb8;font-size:12px;font-family:monospace}
.vendor-cell{font-size:11px;font-weight:700;color:#0D6D72;font-family:monospace}
.catno-cell{font-family:monospace;font-weight:700;font-size:12px;color:var(--teal)}

.push-bar{display:none;position:sticky;bottom:0;background:var(--navy);color:#fff;padding:12px 24px;align-items:center;justify-content:space-between;gap:16px;z-index:10}
.push-bar.show{display:flex}
.push-bar p{font-size:14px;font-weight:600}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>⚡ Pricing Admin</h1>
    <p>Pep Suppliers internal tool</p>
    <input type="password" id="pw-input" placeholder="Site password" autocomplete="current-password">
    <input type="password" id="token-input" placeholder="GitHub token" autocomplete="off">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#6b7f94;margin-top:4px;margin-bottom:12px;cursor:pointer">
      <input type="checkbox" id="remember-me" style="cursor:pointer"> Remember me on this device
    </label>
    <button onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="admin-screen">
  <div class="admin-header">
    <h1>⚡ Pricing Admin</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="product-count" style="font-size:13px;opacity:.7"></span>
      <button class="btn btn-secondary" style="font-size:11px;padding:5px 10px;opacity:.6" onclick="clearToken()">Reset Token</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="search-box" placeholder="Search..." oninput="filterTable()">
    <select id="category-filter" onchange="filterTable()">
      <option value="">All Categories</option>
      <option value="weight management">Weight Management</option>
      <option value="hormone support">Hormone Support</option>
      <option value="recovery & healing">Recovery &amp; Healing</option>
      <option value="peptide blends">Peptide Blends</option>
      <option value="other research">Other Research</option>
    </select>
    <div class="toolbar-divider"></div>
    <div class="markup-group">
      <label>Markup %</label>
      <input type="number" id="global-markup" min="0" max="1000" step="1" placeholder="50">
      <button class="btn btn-secondary" style="padding:5px 12px;font-size:12px" onclick="applyGlobalMarkup()">Apply</button>
      <button class="btn btn-danger" style="padding:5px 12px;font-size:12px" onclick="resetAll()">Reset</button>
    </div>
    <div class="toolbar-divider"></div>
    <span id="changes-label" style="font-size:13px;font-weight:600;color:#6b7f94">No changes</span>
  </div>

  <div class="status-bar" id="status-bar"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Cat No</th>
          <th>Product</th>
          <th>Size</th>
          <th>Category</th>
          <th>Vendor</th>
          <th>Best Cost</th>
          <th>Sale Price</th>
          <th>In Stock</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<div class="push-bar" id="push-bar">
  <div>
    <p id="push-summary">Ready to push</p>
    <small style="opacity:.7;font-size:12px">Updates products.json on GitHub → live in ~30s</small>
  </div>
  <button class="btn btn-primary" onclick="pushToGitHub()">🚀 Push to Site</button>
</div>

<script>
var GITHUB_TOKEN = '';
var REPO = 'jason370/pep-suppliers';
var GH_RAW = 'https://raw.githubusercontent.com/' + REPO + '/main/';

var _products = [];
var _pcBySiteName = {};  // site product name -> [{cat_no, spec, cost, vendor}]
var _changes = {};       // "productId::spec" -> new price string, or "_stock_::productId" -> bool
var _sha = '';

function buildPcIndex(pc) {
  _pcBySiteName = {};
  function numSort(a,b){ return (parseFloat(a.size)||0)-(parseFloat(b.size)||0); }
  pc.forEach(function(entry) {
    if (!entry.allVendors || !entry.allVendors.length) return;
    var best = entry.allVendors[0];
    var cost = parseFloat((best.price||'').replace(/[^0-9.]/g,''));
    var specStr = (entry.spec||'').trim();
    var vialMatch = specStr.match(/\*(\d+)vial/i);
    var vialCount = vialMatch ? parseInt(vialMatch[1]) : 10;
    var sizeData = {
      cat_no: (entry.cat_no||'').trim(),
      spec: specStr,
      size: specStr.split('*')[0].trim(),
      cost: cost || null,
      costPerVial: cost ? cost / vialCount : null,
      vialCount: vialCount,
      vendor: (best.vendor||'').trim()
    };
    var names = entry.site_names || [entry.name];
    names.forEach(function(sn) {
      sn = sn.trim();
      if (!_pcBySiteName[sn]) _pcBySiteName[sn] = [];
      _pcBySiteName[sn].push(sizeData);
    });
  });
  // Sort sizes numerically for each product
  Object.keys(_pcBySiteName).forEach(function(k){ _pcBySiteName[k].sort(numSort); });
}

function getSizes(p) {
  // Returns array of {cat_no, size, cost, vendor, key}
  var pcSizes = _pcBySiteName[p.name] || [];
  if (pcSizes.length) {
    return pcSizes.map(function(s) {
      return {cat_no: s.cat_no, size: s.size, cost: s.cost, costPerVial: s.costPerVial, vialCount: s.vialCount, vendor: s.vendor, key: p.id + '::' + s.size};
    });
  }
  // Fallback: use vialSizes from product with no cost data
  return (p.vialSizes||[]).map(function(sz) {
    return {cat_no: '', size: sz, cost: null, vendor: null, key: p.id + '::' + sz};
  });
}

function getOriginalPrice(p, size) {
  // Try to find existing price for this size from p.prices or p.price
  if (p.prices && p.prices[size] !== undefined) return p.prices[size];
  // If only one size, use p.price
  var sizes = getSizes(p);
  if (sizes.length === 1) return p.price || '';
  return '';
}

function doLogin() {
  var pw = document.getElementById('pw-input').value.trim();
  if (!pw) return;
  var tokenField = document.getElementById('token-input').value.trim();
  if (tokenField) GITHUB_TOKEN = tokenField;
  else GITHUB_TOKEN = localStorage.getItem('pep_gh_token') || '';
  if (!GITHUB_TOKEN) {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('login-error').textContent = 'GitHub token required.';
    return;
  }
  if (document.getElementById('remember-me').checked) {
    localStorage.setItem('pep_admin_pw', pw);
    localStorage.setItem('pep_gh_token', GITHUB_TOKEN);
  } else {
    localStorage.removeItem('pep_admin_pw');
    localStorage.removeItem('pep_gh_token');
  }
  loadData();
}

function clearToken() {
  localStorage.removeItem('pep_gh_token');
  GITHUB_TOKEN = '';
  alert('Token cleared.');
}

document.getElementById('pw-input').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

function showStatus(msg, type) {
  var bar = document.getElementById('status-bar');
  bar.innerHTML = msg;
  bar.className = 'status-bar ' + type;
}
function hideStatus(){ document.getElementById('status-bar').className = 'status-bar'; }

function loadData() {
  showStatus('Loading...', 'loading');
  Promise.all([
    fetch(GH_RAW + 'products.json?t=' + Date.now()).then(function(r){ return r.json(); }),
    fetch(GH_RAW + 'price-compare.json?t=' + Date.now()).then(function(r){ return r.json(); }),
    fetch('https://api.github.com/repos/' + REPO + '/contents/products.json',
      {headers:{'Authorization':'token ' + GITHUB_TOKEN}}).then(function(r){ return r.json(); })
  ])
  .then(function(results) {
    _products = results[0];
    buildPcIndex(results[1]);
    _sha = results[2].sha;
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    document.getElementById('product-count').textContent = _products.length + ' products';
    hideStatus();
    renderTable();
  })
  .catch(function(e){
    var el = document.getElementById('login-error');
    el.style.display = 'block';
    el.textContent = 'Load failed: ' + e.message;
    hideStatus();
  });
}

function catBadge(cat) {
  var map = {'Weight Management':'badge-weight','Hormone Support':'badge-gh','Recovery & Healing':'badge-healing','Peptide Blends':'badge-blends','Other Research':'badge-other'};
  return '<span class="badge ' + (map[cat]||'badge-other') + '">' + esc(cat) + '</span>';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }

function renderTable() {
  var tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  _products.forEach(function(p) {
    var sizes = getSizes(p);
    var isFirstSize = true;

    sizes.forEach(function(s) {
      var key = s.key;
      var origPrice = getOriginalPrice(p, s.size);
      var currentPrice = _changes[key] !== undefined ? _changes[key] : origPrice;
      var isChanged = _changes[key] !== undefined;

      var tr = document.createElement('tr');
      tr.className = 'size-row' + (isChanged ? ' changed-row' : '');
      tr.dataset.name = (p.name + ' ' + s.cat_no).toLowerCase();
      tr.dataset.category = (p.category||'').toLowerCase();
      tr.dataset.productid = p.id;

      tr.innerHTML =
        '<td class="catno-cell">' + esc(s.cat_no) + '</td>' +
        '<td>' + (isFirstSize ? '<strong>' + esc(p.name) + '</strong>' : '<span style="color:#9aabb8">↳</span>') + '</td>' +
        '<td style="font-size:12px;font-weight:600">' + esc(s.size) + '</td>' +
        (isFirstSize ? '<td>' + catBadge(p.category) + '</td>' : '<td></td>') +
        '<td class="vendor-cell">' + (s.vendor ? esc(s.vendor) : '<span style="color:#ddd">—</span>') + '</td>' +
        '<td class="cost-cell">' + (s.cost !== null ? '$' + s.cost.toFixed(2) + ' <span style="color:#bbb;font-size:10px">($' + s.costPerVial.toFixed(2) + '/vial)</span>' : '<span style="color:#ddd">—</span>') + '</td>' +
        '<td><input class="price-input' + (isChanged?' changed':'') + '" type="text" value="' + escAttr(currentPrice) + '" ' +
          'data-key="' + escAttr(key) + '" data-cost="' + (s.cost||'') + '" data-original="' + escAttr(origPrice) + '" ' +
          'oninput="onPriceChange(this)"></td>' +
        (isFirstSize ?
          '<td><input type="checkbox"' + (p.inStock?' checked':'') + ' data-id="' + escAttr(p.id) + '" onchange="onStockChange(this)" style="width:16px;height:16px;cursor:pointer;accent-color:var(--teal)"></td>' :
          '<td></td>');

      tbody.appendChild(tr);
      isFirstSize = false;
    });
  });

  filterTable();
}

function onPriceChange(input) {
  var key = input.dataset.key;
  var val = input.value.trim();
  if (val !== input.dataset.original) {
    _changes[key] = val;
    input.classList.add('changed');
    input.closest('tr').classList.add('changed-row');
  } else {
    delete _changes[key];
    input.classList.remove('changed');
    input.closest('tr').classList.remove('changed-row');
  }
  updateChangesLabel();
}

function onStockChange(cb) {
  var id = cb.dataset.id;
  _changes['_stock_::' + id] = cb.checked;
  updateChangesLabel();
}

function applyGlobalMarkup() {
  var pct = parseFloat(document.getElementById('global-markup').value);
  if (isNaN(pct)) { alert('Enter a markup % first'); return; }
  var mult = 1 + pct / 100;
  var applied = 0;
  document.querySelectorAll('#table-body tr.size-row').forEach(function(row) {
    if (row.style.display === 'none') return;
    var input = row.querySelector('.price-input');
    if (!input) return;
    var cost = parseFloat(input.dataset.cost);
    if (!cost) return;
    input.value = '$' + (cost * mult).toFixed(2);
    onPriceChange(input);
    applied++;
  });
  showStatus('✅ Applied ' + pct + '% markup to ' + applied + ' sizes with cost data.', 'success');
}

function resetAll() {
  if (!confirm('Reset all price changes?')) return;
  _changes = {};
  document.querySelectorAll('.price-input').forEach(function(input){
    input.value = input.dataset.original;
    input.classList.remove('changed');
    input.closest('tr').classList.remove('changed-row');
  });
  updateChangesLabel();
}

function updateChangesLabel() {
  var count = Object.keys(_changes).length;
  var label = document.getElementById('changes-label');
  label.textContent = count > 0 ? count + ' change' + (count===1?'':'s') + ' pending' : 'No changes';
  label.style.color = count > 0 ? '#f0a500' : '#6b7f94';
  var pb = document.getElementById('push-bar');
  if (count > 0) { pb.classList.add('show'); document.getElementById('push-summary').textContent = count + ' change' + (count===1?'':'s') + ' ready to push'; }
  else { pb.classList.remove('show'); }
}

function filterTable() {
  var search = document.getElementById('search-box').value.toLowerCase();
  var cat = document.getElementById('category-filter').value.toLowerCase();
  // Track which product ids are visible
  var visibleProducts = {};
  document.querySelectorAll('#table-body tr.size-row').forEach(function(row){
    var show = (!search || row.dataset.name.includes(search)) &&
               (!cat || row.dataset.category === cat);
    if (show) visibleProducts[row.dataset.productid] = true;
    row.style.display = show ? '' : 'none';
  });
}

function pushToGitHub() {
  if (!Object.keys(_changes).length) return;
  document.querySelector('#push-bar .btn').disabled = true;
  showStatus('⏳ Pushing...', 'loading');

  // Build updated products: collect per-size prices
  var updated = _products.map(function(p) {
    var out = Object.assign({}, p);
    // Apply stock changes
    if (_changes['_stock_::' + p.id] !== undefined) out.inStock = _changes['_stock_::' + p.id];

    // Collect size prices
    var sizes = getSizes(p);
    var newPrices = Object.assign({}, p.prices || {});
    var allPrices = [];
    sizes.forEach(function(s) {
      var key = s.key;
      var val = _changes[key] !== undefined ? _changes[key] : getOriginalPrice(p, s.size);
      if (val) {
        newPrices[s.size] = val;
        var num = parseFloat(val.replace(/[^0-9.]/g,''));
        if (num) allPrices.push(num);
      }
    });

    if (Object.keys(newPrices).length) {
      out.prices = newPrices;
      // Set p.price to cheapest for card display
      if (allPrices.length) {
        allPrices.sort(function(a,b){return a-b;});
        var cheapest = '$' + allPrices[0].toFixed(2);
        var mostExp = '$' + allPrices[allPrices.length-1].toFixed(2);
        out.price = allPrices.length > 1 ? cheapest + ' – ' + mostExp : cheapest;
      }
    }
    return out;
  });

  var content = btoa(unescape(encodeURIComponent(JSON.stringify(updated, null, 2))));
  fetch('https://api.github.com/repos/' + REPO + '/contents/products.json',
    {headers:{'Authorization':'token ' + GITHUB_TOKEN}})
  .then(function(r){ return r.json(); })
  .then(function(d){
    return fetch('https://api.github.com/repos/' + REPO + '/contents/products.json', {
      method: 'PUT',
      headers: {'Authorization':'token ' + GITHUB_TOKEN, 'Content-Type':'application/json'},
      body: JSON.stringify({message:'Update prices from admin', content: content, sha: d.sha})
    });
  })
  .then(function(r){ return r.json(); })
  .then(function(result){
    if (result.content) {
      _products = updated; _changes = {};
      updateChangesLabel(); renderTable();
      showStatus('✅ Pushed! Site updates in ~30 seconds.', 'success');
    } else {
      showStatus('❌ Push failed: ' + JSON.stringify(result), 'error');
      document.querySelector('#push-bar .btn').disabled = false;
    }
  })
  .catch(function(e){
    showStatus('❌ Error: ' + e.message, 'error');
    document.querySelector('#push-bar .btn').disabled = false;
  });
}

(function(){
  var savedPw = localStorage.getItem('pep_admin_pw');
  var savedToken = localStorage.getItem('pep_gh_token');
  if (savedToken) document.getElementById('token-input').value = savedToken;
  if (savedPw && savedToken) {
    document.getElementById('pw-input').value = savedPw;
    document.getElementById('remember-me').checked = true;
    GITHUB_TOKEN = savedToken;
    loadData();
  }
})();
</script>
</body>
</html>
