<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing Admin | Pep Suppliers</title>
<style>
:root{--navy:#071833;--teal:#0D6D72;--border:#e2ecf0;--bg:#f7fafc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--navy)}

#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#fff;border-radius:16px;border:1px solid var(--border);padding:48px 40px;width:360px;text-align:center;box-shadow:0 4px 24px rgba(7,24,51,.10)}
.login-box h1{font-size:22px;margin-bottom:8px}
.login-box p{color:#6b7f94;font-size:14px;margin-bottom:24px}
.login-box input{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:10px;font-size:15px;margin-bottom:12px;outline:none}
.login-box input:focus{border-color:var(--teal)}
.login-box button{width:100%;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.login-error{color:#c0392b;font-size:13px;margin-top:8px;display:none}

#admin-screen{display:none;min-height:100vh}
.admin-header{background:var(--navy);color:#fff;padding:16px 32px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.admin-header h1{font-size:18px;font-weight:900}

.toolbar{display:flex;align-items:center;gap:12px;padding:16px 32px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.toolbar input[type=search]{flex:1;min-width:200px;padding:9px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none}
.toolbar select{padding:9px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;outline:none;cursor:pointer}
.btn{padding:9px 18px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;white-space:nowrap}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:#0a5a5f}
.btn-primary:disabled{background:#9aabb8;cursor:not-allowed}
.btn-secondary{background:#fff;color:var(--navy);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:#fff;color:#c0392b;border:1px solid #f5c6cb}
.toolbar-divider{width:1px;height:28px;background:var(--border)}

.markup-bar{display:flex;align-items:center;gap:10px;padding:12px 32px;background:#fffbe6;border-bottom:1px solid #f0e68c;flex-wrap:wrap}
.markup-bar label{font-size:13px;font-weight:700;color:#856404}
.markup-bar input[type=number]{width:80px;padding:7px 10px;border:1px solid #f0e68c;border-radius:8px;font-size:14px;font-weight:700;text-align:center;outline:none}
.markup-bar input:focus{border-color:var(--teal)}
.markup-bar small{color:#6b7f94;font-size:12px}

.status-bar{padding:10px 32px;font-size:13px;font-weight:600;display:none}
.status-bar.success{background:#d4edda;color:#155724;display:block}
.status-bar.error{background:#f8d7da;color:#721c24;display:block}
.status-bar.loading{background:#d1ecf1;color:#0c5460;display:block}

.table-wrap{padding:24px 32px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border);font-size:13px}
thead tr{background:var(--navy);color:#fff}
thead th{padding:11px 12px;text-align:left;font-weight:700;white-space:nowrap}
tbody tr:nth-child(even){background:#f7fafc}
tbody tr:hover{background:#EEF8FA}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:middle}
.changed-row{background:#fffbe6!important}
.changed-row td:first-child{border-left:3px solid #f0a500}

.badge{display:inline-block;padding:3px 9px;border-radius:12px;font-size:11px;font-weight:700}
.badge-weight{background:#fce7f3;color:#9d174d}
.badge-gh{background:#d1fae5;color:#065f46}
.badge-healing{background:#dbeafe;color:#1e40af}
.badge-blends{background:#ede9fe;color:#5b21b6}
.badge-other{background:#f3f4f6;color:#374151}

.price-input{width:110px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;text-align:right;outline:none;font-family:monospace}
.price-input:focus{border-color:var(--teal)}
.price-input.changed{border-color:#f0a500;background:#fffbe6}
.cost-cell{color:#9aabb8;font-size:12px;font-family:monospace}

.changes-count{background:#f0a500;color:#fff;border-radius:12px;padding:2px 8px;font-size:12px;font-weight:700;margin-left:6px;display:none}

.push-bar{display:none;position:sticky;bottom:0;background:var(--navy);color:#fff;padding:14px 32px;align-items:center;justify-content:space-between;gap:16px;z-index:10}
.push-bar.show{display:flex}
.push-bar p{font-size:14px;font-weight:600}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>⚡ Pricing Admin</h1>
    <p>Pep Suppliers internal tool</p>
    <input type="password" id="pw-input" placeholder="Site password" autocomplete="current-password">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#6b7f94;margin-top:4px;cursor:pointer"><input type="checkbox" id="remember-me" style="cursor:pointer"> Remember me on this device</label>
    <button onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="admin-screen">
  <div class="admin-header">
    <h1>⚡ Pricing Admin</h1>
    <span id="product-count"></span>
  </div>

  <div class="markup-bar">
    <label>Global Markup %</label>
    <input type="number" id="global-markup" min="0" max="1000" step="1" placeholder="e.g. 50">
    <button class="btn btn-secondary" onclick="applyGlobalMarkup()">Apply to All</button>
    <button class="btn btn-danger" onclick="resetAll()">Reset All</button>
    <small>Sets sale price = best cost price × (1 + markup%). Then adjust rows individually.</small>
  </div>

  <div class="toolbar">
    <input type="search" id="search-box" placeholder="Search..." oninput="filterTable()">
    <select id="category-filter" onchange="filterTable()">
      <option value="">All Categories</option>
      <option value="Weight Management">Weight Management</option>
      <option value="Hormone Support">Hormone Support</option>
      <option value="Recovery &amp; Healing">Recovery &amp; Healing</option>
      <option value="Peptide Blends">Peptide Blends</option>
      <option value="Other Research">Other Research</option>
    </select>
    <select id="wh-filter" onchange="filterTable()">
      <option value="">All Warehouses</option>
      <option value="US Warehouse">US Warehouse</option>
      <option value="Overseas Warehouse">Overseas Warehouse</option>
    </select>
    <div class="toolbar-divider"></div>
    <span id="changes-label" style="font-size:13px;font-weight:600;color:#6b7f94">No changes</span>
  </div>

  <div class="status-bar" id="status-bar"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Product</th>
          <th>Category</th>
          <th>Warehouse</th>
          <th>Best Cost</th>
          <th>Sale Price</th>
          <th>In Stock</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<div class="push-bar" id="push-bar">
  <div>
    <p id="push-summary">Ready to push</p>
    <small style="opacity:.7;font-size:12px">Updates products.json on GitHub → live in ~30s</small>
  </div>
  <button class="btn btn-primary" onclick="pushToGitHub()">🚀 Push to Site</button>
</div>

<script>
var GITHUB_TOKEN = '';
var REPO = 'jason370/pep-suppliers';
var GH_RAW = 'https://raw.githubusercontent.com/' + REPO + '/main/';

var _products = [];      // site products.json (old format)
var _costMap = {};       // cat_no -> best cost price from price-compare.json
var _changes = {};       // id -> new price string
var _sha = '';

function doLogin() {
  GITHUB_TOKEN = localStorage.getItem('pep_gh_token') || '';
  if (!GITHUB_TOKEN) {
    GITHUB_TOKEN = prompt('Enter GitHub token (saved locally):');
    if (GITHUB_TOKEN) localStorage.setItem('pep_gh_token', GITHUB_TOKEN);
  }
  if (!GITHUB_TOKEN) return;
  if (document.getElementById("remember-me") && document.getElementById("remember-me").checked) {
    localStorage.setItem("pep_admin_pw", document.getElementById("pw-input").value.trim());
  }
  var pw = document.getElementById('pw-input').value.trim();
  if (!pw) return;
  loadData();
}
document.getElementById('pw-input').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

function showStatus(msg, type) {
  var bar = document.getElementById('status-bar');
  bar.innerHTML = msg;
  bar.className = 'status-bar ' + type;
}
function hideStatus(){ document.getElementById('status-bar').className = 'status-bar'; }

function loadData() {
  showStatus('Loading...', 'loading');
  // Load both files in parallel
  Promise.all([
    fetch(GH_RAW + 'products.json?t=' + Date.now()).then(function(r){ return r.json(); }),
    fetch(GH_RAW + 'price-compare.json?t=' + Date.now()).then(function(r){ return r.json(); }),
    fetch('https://api.github.com/repos/' + REPO + '/contents/products.json',
      {headers:{'Authorization':'token ' + GITHUB_TOKEN}}).then(function(r){ return r.json(); })
  ])
  .then(function(results) {
    _products = results[0];
    var priceCompare = results[1];
    _sha = results[2].sha;

    // Build cost map: product name (lowercase) -> best cost price
    priceCompare.forEach(function(pc) {
      if (pc.allVendors && pc.allVendors.length) {
        var bestCost = parseFloat(pc.allVendors[0].price.replace(/[^0-9.]/g,''));
        // Map by product name variations
        var key = pc.name.toLowerCase().trim();
        _costMap[key] = bestCost;
        if (pc.cat_no) _costMap[pc.cat_no.toLowerCase()] = bestCost;
      }
    });

    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    document.getElementById('product-count').textContent = _products.length + ' products';
    hideStatus();
    renderTable();
  })
  .catch(function(e){
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('login-error').textContent = 'Load failed: ' + e.message;
    hideStatus();
  });
}

function getBestCost(p) {
  var name = (p.name || '').toLowerCase().trim();
  if (_costMap[name] !== undefined) return _costMap[name];
  // Try stripping warehouse suffix from id
  var idBase = (p.id || '').replace(/-us-warehouse|-overseas-warehouse/g,'').replace(/-/g,' ');
  if (_costMap[idBase] !== undefined) return _costMap[idBase];
  return null;
}

function catBadge(cat) {
  var map = {
    'Weight Management':'badge-weight',
    'Hormone Support':'badge-gh',
    'Recovery & Healing':'badge-healing',
    'Peptide Blends':'badge-blends',
    'Other Research':'badge-other'
  };
  var cls = map[cat] || 'badge-other';
  return '<span class="badge ' + cls + '">' + esc(cat) + '</span>';
}

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }

function renderTable() {
  var tbody = document.getElementById('table-body');
  tbody.innerHTML = '';
  _products.forEach(function(p, i) {
    var cost = getBestCost(p);
    var currentPrice = _changes[p.id] !== undefined ? _changes[p.id] : (p.price || '');
    var isChanged = _changes[p.id] !== undefined;
    var tr = document.createElement('tr');
    if (isChanged) tr.classList.add('changed-row');
    tr.dataset.name = (p.name||'').toLowerCase();
    tr.dataset.category = (p.category||'').toLowerCase();
    tr.dataset.warehouse = (p.warehouse||'').toLowerCase();
    tr.innerHTML =
      '<td style="color:#9aabb8;font-size:11px">' + (i+1) + '</td>' +
      '<td><strong>' + esc(p.name) + '</strong></td>' +
      '<td>' + catBadge(p.category) + '</td>' +
      '<td style="font-size:12px;color:#6b7f94">' + esc(p.warehouse||'—') + '</td>' +
      '<td class="cost-cell">' + (cost !== null ? '$' + cost.toFixed(2) : '<span style="color:#ddd">—</span>') + '</td>' +
      '<td><input class="price-input' + (isChanged?' changed':'') + '" type="text" value="' + escAttr(currentPrice) + '" data-id="' + escAttr(p.id) + '" data-cost="' + (cost||'') + '" data-original="' + escAttr(p.price||'') + '" oninput="onPriceChange(this)"></td>' +
      '<td><input type="checkbox"' + (p.inStock?' checked':'') + ' data-id="' + escAttr(p.id) + '" onchange="onStockChange(this)" style="width:16px;height:16px;cursor:pointer;accent-color:var(--teal)"></td>';
    tbody.appendChild(tr);
  });
  filterTable();
}

function onPriceChange(input) {
  var id = input.dataset.id;
  var val = input.value.trim();
  if (val !== input.dataset.original) {
    _changes[id] = val;
    input.classList.add('changed');
    input.closest('tr').classList.add('changed-row');
  } else {
    delete _changes[id];
    input.classList.remove('changed');
    input.closest('tr').classList.remove('changed-row');
  }
  updateChangesLabel();
}

function onStockChange(cb) {
  var id = cb.dataset.id;
  var p = _products.find(function(x){ return x.id === id; });
  if (p) { p.inStock = cb.checked; _changes['_stock_' + id] = cb.checked; updateChangesLabel(); }
}

function applyGlobalMarkup() {
  var pct = parseFloat(document.getElementById('global-markup').value);
  if (isNaN(pct)) { alert('Enter a markup % first'); return; }
  var mult = 1 + pct / 100;
  var applied = 0;
  document.querySelectorAll('#table-body tr').forEach(function(row) {
    if (row.style.display === 'none') return;
    var input = row.querySelector('.price-input');
    if (!input) return;
    var cost = parseFloat(input.dataset.cost);
    if (!cost) return;
    var newPrice = '$' + (cost * mult).toFixed(2);
    input.value = newPrice;
    onPriceChange(input);
    applied++;
  });
  showStatus('✅ Applied ' + pct + '% markup to ' + applied + ' visible products.', 'success');
}

function resetAll() {
  if (!confirm('Reset all price changes?')) return;
  _changes = {};
  document.querySelectorAll('.price-input').forEach(function(input){
    input.value = input.dataset.original;
    input.classList.remove('changed');
    input.closest('tr').classList.remove('changed-row');
  });
  updateChangesLabel();
}

function updateChangesLabel() {
  var count = Object.keys(_changes).length;
  var label = document.getElementById('changes-label');
  label.textContent = count > 0 ? count + ' change' + (count===1?'':'s') + ' pending' : 'No changes';
  label.style.color = count > 0 ? '#f0a500' : '#6b7f94';
  var pb = document.getElementById('push-bar');
  if (count > 0) {
    pb.classList.add('show');
    document.getElementById('push-summary').textContent = count + ' change' + (count===1?'':'s') + ' ready to push';
  } else {
    pb.classList.remove('show');
  }
}

function filterTable() {
  var search = document.getElementById('search-box').value.toLowerCase();
  var cat = document.getElementById('category-filter').value.toLowerCase();
  var wh = document.getElementById('wh-filter').value.toLowerCase();
  document.querySelectorAll('#table-body tr').forEach(function(row){
    var show = (!search || row.dataset.name.includes(search)) &&
               (!cat || row.dataset.category === cat) &&
               (!wh || row.dataset.warehouse === wh);
    row.style.display = show ? '' : 'none';
  });
}

function pushToGitHub() {
  if (!Object.keys(_changes).length) return;
  document.querySelector('#push-bar .btn').disabled = true;
  showStatus('⏳ Pushing...', 'loading');

  // Apply changes to products array
  var updated = _products.map(function(p) {
    var out = Object.assign({}, p);
    if (_changes[p.id] !== undefined) out.price = _changes[p.id];
    if (_changes['_stock_' + p.id] !== undefined) out.inStock = _changes['_stock_' + p.id];
    return out;
  });

  var content = btoa(unescape(encodeURIComponent(JSON.stringify(updated, null, 2))));

  // Refresh SHA then push
  fetch('https://api.github.com/repos/' + REPO + '/contents/products.json',
    {headers:{'Authorization':'token ' + GITHUB_TOKEN}})
  .then(function(r){ return r.json(); })
  .then(function(d){
    return fetch('https://api.github.com/repos/' + REPO + '/contents/products.json', {
      method: 'PUT',
      headers: {'Authorization':'token ' + GITHUB_TOKEN, 'Content-Type':'application/json'},
      body: JSON.stringify({message:'Update prices from admin', content: content, sha: d.sha})
    });
  })
  .then(function(r){ return r.json(); })
  .then(function(result){
    if (result.content) {
      _products = updated;
      _changes = {};
      updateChangesLabel();
      renderTable();
      showStatus('✅ Pushed! Site updates in ~30 seconds.', 'success');
    } else {
      showStatus('❌ Push failed: ' + JSON.stringify(result), 'error');
      document.querySelector('#push-bar .btn').disabled = false;
    }
  })
  .catch(function(e){
    showStatus('❌ Error: ' + e.message, 'error');
    document.querySelector('#push-bar .btn').disabled = false;
  });
}
</script>

<script>
// Auto-login if saved password exists
(function(){
  var saved = localStorage.getItem('pep_admin_pw');
  if (saved) {
    document.getElementById('pw-input').value = saved;
    document.getElementById('remember-me').checked = true;
    loadData();
  }
})();
</script>
</body>
</html>
