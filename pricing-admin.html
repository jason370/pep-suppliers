<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing Admin | Pep Suppliers</title>
<style>
:root{--navy:#071833;--teal:#0D6D72;--border:#e2ecf0;--bg:#f7fafc}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--navy)}

#login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#fff;border-radius:16px;border:1px solid var(--border);padding:48px 40px;width:360px;text-align:center;box-shadow:0 4px 24px rgba(7,24,51,.10)}
.login-box h1{font-size:22px;margin-bottom:8px}
.login-box p{color:#6b7f94;font-size:14px;margin-bottom:24px}
.login-box input[type=password]{width:100%;padding:12px 16px;border:1px solid var(--border);border-radius:10px;font-size:15px;margin-bottom:12px;outline:none}
.login-box input[type=password]:focus{border-color:var(--teal)}
.login-box button{width:100%;background:var(--navy);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.login-error{color:#c0392b;font-size:13px;margin-top:8px;display:none}

#admin-screen{display:none;min-height:100vh}
.admin-header{background:var(--navy);color:#fff;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.admin-header h1{font-size:17px;font-weight:900}

.toolbar{display:flex;align-items:center;gap:8px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--border);flex-wrap:wrap}
.toolbar input[type=search]{width:160px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none}
.toolbar select{padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff;outline:none;cursor:pointer}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;white-space:nowrap}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:#0a5a5f}
.btn-primary:disabled{background:#9aabb8;cursor:not-allowed}
.btn-secondary{background:#fff;color:var(--navy);border:1px solid var(--border)}
.btn-secondary:hover{background:var(--bg)}
.btn-danger{background:#fff;color:#c0392b;border:1px solid #f5c6cb}
.toolbar-divider{width:1px;height:26px;background:var(--border);flex-shrink:0}
.markup-group{display:flex;align-items:center;gap:6px;background:#fffbe6;border:1px solid #f0e68c;border-radius:8px;padding:5px 10px}
.markup-group label{font-size:12px;font-weight:700;color:#856404;white-space:nowrap}
.markup-group input[type=number]{width:64px;padding:5px 8px;border:1px solid #f0e68c;border-radius:6px;font-size:13px;font-weight:700;text-align:center;outline:none;background:#fff}
.markup-group input:focus{border-color:var(--teal)}

.status-bar{padding:9px 24px;font-size:13px;font-weight:600;display:none}
.status-bar.success{background:#d4edda;color:#155724;display:block}
.status-bar.error{background:#f8d7da;color:#721c24;display:block}
.status-bar.loading{background:#d1ecf1;color:#0c5460;display:block}

.table-wrap{padding:20px 24px;overflow-x:auto}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid var(--border);font-size:13px;table-layout:fixed}
thead tr{background:var(--navy);color:#fff}
thead th{padding:10px 11px;text-align:left;font-weight:700;white-space:nowrap}
tbody tr:nth-child(even){background:#f7fafc}
tbody tr:hover{background:#EEF8FA}
tbody td{padding:8px 11px;border-bottom:1px solid var(--border);vertical-align:middle}

/* Product group header row */
tr.product-header td{background:#e8f4f8;font-weight:700;border-top:2px solid var(--teal);padding:6px 11px}
tr.product-header td:first-child{color:var(--teal)}

tr.size-row td{padding:5px 8px}
tr.size-row.changed-row{background:#fffbe6!important}
tr.size-row.changed-row td:first-child{border-left:3px solid #f0a500}

.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:700}
.badge-weight{background:#fce7f3;color:#9d174d}
.badge-gh{background:#d1fae5;color:#065f46}
.badge-healing{background:#dbeafe;color:#1e40af}
.badge-blends{background:#ede9fe;color:#5b21b6}
.badge-other{background:#f3f4f6;color:#374151}

.price-input{width:100px;padding:5px 8px;border:1px solid var(--border);border-radius:6px;font-size:13px;text-align:right;outline:none;font-family:monospace}
.price-input:focus{border-color:var(--teal)}
.price-input.changed{border-color:#f0a500;background:#fffbe6}
.cost-cell{color:#9aabb8;font-size:12px;font-family:monospace}
.vendor-cell{font-size:18px;font-weight:700;color:#0D6D72;font-family:monospace}
.catno-cell{font-family:monospace;font-weight:700;font-size:12px;color:var(--teal)}
.btn-icon{background:#fff;border:1px solid var(--border);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;cursor:pointer;color:#6b7f94;line-height:1.4}
.btn-icon:hover{background:#fff5f5;color:#c0392b;border-color:#f5c6cb}
.btn-icon.card-del{color:#c0392b;border-color:#f5c6cb}
tr.deleted-row td{opacity:.45;text-decoration:line-through}
tr.deleted-row .btn-icon{display:none}

.push-bar{display:none;position:sticky;bottom:0;background:var(--navy);color:#fff;padding:12px 24px;align-items:center;justify-content:space-between;gap:16px;z-index:10}
.push-bar.show{display:flex}
.push-bar p{font-size:14px;font-weight:600}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <h1>⚡ Pricing Admin</h1>
    <p>Pep Suppliers internal tool</p>
    <input type="password" id="pw-input" placeholder="Site password" autocomplete="current-password">
    <input type="password" id="token-input" placeholder="GitHub token" autocomplete="off">
    <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#6b7f94;margin-top:4px;margin-bottom:12px;cursor:pointer">
      <input type="checkbox" id="remember-me" style="cursor:pointer"> Remember me on this device
    </label>
    <button onclick="doLogin()">Sign In</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<div id="admin-screen">
  <div class="admin-header">
    <h1>⚡ Pricing Admin</h1>
    <div style="display:flex;align-items:center;gap:12px">
      <span id="product-count" style="font-size:13px;opacity:.7"></span>
      <button class="btn btn-secondary" style="font-size:11px;padding:5px 10px;opacity:.6" onclick="clearToken()">Reset Token</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="search" id="search-box" placeholder="Search..." oninput="filterTable()">
    <select id="category-filter" onchange="filterTable()">
      <option value="">All Categories</option>
      <option value="weight management">Weight Management</option>
      <option value="hormone support">Hormone Support</option>
      <option value="recovery & healing">Recovery &amp; Healing</option>
      <option value="peptide blends">Peptide Blends</option>
      <option value="other research">Other Research</option>
    </select>
    <div class="toolbar-divider"></div>
    <div class="markup-group">
      <label>Markup %</label>
      <input type="number" id="global-markup" min="0" max="1000" step="1" placeholder="50">
      <button class="btn btn-secondary" style="padding:5px 12px;font-size:12px" onclick="applyGlobalMarkup()">Apply</button>
      <button class="btn btn-danger" style="padding:5px 12px;font-size:12px" onclick="resetAll()">Reset</button>
    </div>
    <div class="toolbar-divider"></div>
    <span id="changes-label" style="font-size:13px;font-weight:600;color:#6b7f94">No changes</span>
  </div>

  <div class="status-bar" id="status-bar"></div>

  <div class="table-wrap">
    <table>
      <colgroup>
        <col style="width:200px">
        <col style="width:60px">
        <col style="width:70px">
        <col style="width:110px">
        <col style="width:70px">
        <col style="width:80px">
        <col style="width:75px">
        <col style="width:100px">
        <col style="width:55px">
        <col style="width:88px">
      </colgroup>
      <thead>
        <tr>
          <th>Product</th>
          <th>Size</th>
          <th>Cat No</th>
          <th>Category</th>
          <th>Vendor</th>
          <th>Cost</th>
          <th>Cost/Vial</th>
          <th>Sale Price</th>
          <th>In Stock</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
</div>

<div class="push-bar" id="push-bar">
  <div>
    <p id="push-summary">Ready to push</p>
    <small style="opacity:.7;font-size:12px">Updates US Warehouse cards + Peptide Price List (HTML). Use Actions to delete cards or sizes. PDF is not auto-updated.</small>
  </div>
  <button class="btn btn-primary" onclick="pushToGitHub()">🚀 Push to Site</button>
</div>

<script>
var GITHUB_TOKEN = '';
var REPO = 'jason370/pep-suppliers';
var GH_RAW = 'https://raw.githubusercontent.com/' + REPO + '/main/';
var PRICE_LIST_FILE = 'pep-suppliers-us-warehouse-price-list.html';

var _products = [];
var _pcBySiteName = {};  // site product name -> [{cat_no, spec, cost, vendor}]
var _changes = {};       // "productId::spec" -> new price string, or "_stock_::productId" -> bool
var _deletions = { products: {}, sizes: {} };
var _sha = '';
var _priceListSha = '';
var _priceListHead = '';
var _priceListTail = '';
var _priceListRows = [];

var ALIASES = {
  'bpc-157 & tb-500 blend': 'bpc 157 & tb 500 blend',
  'cjc-1295 no dac (mod grf 1-29)': 'cjc 1295 no dac mod grf 1 29',
  'cjc-1295 dac': 'cjc 1295 dac',
  'tb-500 (thymosin beta 4)': 'tb 500 thymosin beta 4',
  'ghk-cu (copper)': 'ghk cu copper',
  'pt-141 (bremelanotide)': 'pt 141 bremelanotide',
  'n-acetyl selank': 'n acetyl selank',
  'n-acetyl semax': 'n acetyl semax',
  'hgh 191aa (somatropin)': 'hgh 191aa somatropin',
  'kisspeptin-10': 'kisspeptin 10',
  'fragment 176-191': 'fragment 176 191',
  'acth 1-39': 'acth 1 39',
  'adipotide (ftpp)': 'adipotide ftpp',
  'gonadorelin (gnrh)': 'gonadorelin gnrh'
};

function normName(s) {
  return String(s || '')
    .toLowerCase()
    .replace(/[+]/g, ' & ')
    .replace(/[^a-z0-9&]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function normSize(s) {
  return String(s || '').toLowerCase().replace(/\s+/g, '');
}

function formatMoney(val) {
  if (!val) return '';
  var n = parseFloat(String(val).replace(/[^0-9.]/g, ''));
  if (!Number.isFinite(n)) return String(val).trim();
  if (Number.isInteger(n)) return '$' + n;
  return '$' + n.toFixed(2);
}

function parsePriceListHtml(html) {
  var tbodyStart = html.indexOf('<tbody>');
  var tbodyEnd = html.indexOf('</tbody>');
  if (tbodyStart < 0 || tbodyEnd < 0) throw new Error('Could not parse price list HTML');
  _priceListHead = html.slice(0, tbodyStart + 7);
  _priceListTail = html.slice(tbodyEnd);
  _priceListRows = [];
  var re = /<tr>\s*<td>([^<]*)<\/td>\s*<td class="size">([^<]*)<\/td>\s*<td class="price">([^<]*)<\/td>\s*<td class="price">([^<]*)<\/td>\s*<\/tr>/gi;
  var m;
  while ((m = re.exec(html))) {
    _priceListRows.push({ product: m[1], size: m[2], us: m[3], china: m[4] });
  }
}

function buildPriceListHtml() {
  var rows = _priceListRows.map(function(r) {
    return '    <tr>\n' +
      '      <td>' + esc(r.product) + '</td>\n' +
      '      <td class="size">' + esc(r.size) + '</td>\n' +
      '      <td class="price">' + esc(r.us) + '</td>\n' +
      '      <td class="price">' + esc(r.china) + '</td>\n' +
      '    </tr>';
  }).join('\n');
  var head = _priceListHead.replace(/\d+\s+items/, _priceListRows.length + ' items');
  return head + '\n' + rows + '\n' + _priceListTail;
}

function buildPriceLookup(products) {
  var lookup = {};
  products.forEach(function(p) {
    if (!p.visible || p.warehouse !== 'US Warehouse') return;
    var base = normName(p.name);
    var keys = [base];
    if (ALIASES[base]) keys.push(ALIASES[base]);
    Object.keys(p.prices || {}).forEach(function(size) {
      var sz = normSize(size);
      keys.forEach(function(k) {
        lookup[k + '|' + sz] = formatMoney(p.prices[size]);
      });
    });
  });
  return lookup;
}

function syncPriceListFromProducts(products) {
  var lookup = buildPriceLookup(products);
  var updated = 0;
  _priceListRows.forEach(function(row) {
    var base = normName(row.product);
    if (ALIASES[base]) base = ALIASES[base];
    var key = base + '|' + normSize(row.size);
    var price = lookup[key];
    if (!price) {
      Object.keys(lookup).forEach(function(k) {
        if (price) return;
        var parts = k.split('|');
        if (parts[1] !== normSize(row.size)) return;
        if (parts[0] === base || parts[0].includes(base) || base.includes(parts[0])) price = lookup[k];
      });
    }
    if (price && row.us !== price) {
      row.us = price;
      updated++;
    }
  });
  return updated;
}

function ghGetFile(path) {
  return fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
    headers: { 'Authorization': 'token ' + GITHUB_TOKEN }
  }).then(function(r) { return r.json(); });
}

function ghPutFile(path, text, message, sha) {
  var content = btoa(unescape(encodeURIComponent(text)));
  return fetch('https://api.github.com/repos/' + REPO + '/contents/' + path, {
    method: 'PUT',
    headers: { 'Authorization': 'token ' + GITHUB_TOKEN, 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: message, content: content, sha: sha })
  }).then(function(r) { return r.json(); });
}

function removeFromObjectBySize(obj, size) {
  if (!obj) return;
  Object.keys(obj).forEach(function(k) {
    if (normSize(k) === normSize(size)) delete obj[k];
  });
}

function applySizeDeletions(p) {
  var out = Object.assign({}, p);
  Object.keys(_deletions.sizes).forEach(function(key) {
    var parts = key.split('::');
    if (parts[0] !== p.id) return;
    var sz = parts[1];
    if (out.vialSizes) {
      out.vialSizes = out.vialSizes.filter(function(s) { return normSize(s) !== normSize(sz); });
    }
    removeFromObjectBySize(out.prices, sz);
    removeFromObjectBySize(out.catalogNos, sz);
    removeFromObjectBySize(out.vialImages, sz);
  });
  return out;
}

function recalcProductPriceRange(p) {
  var nums = [];
  Object.keys(p.prices || {}).forEach(function(sz) {
    var val = p.prices[sz];
    var n = parseFloat(String(val || '').replace(/[^0-9.]/g, ''));
    if (Number.isFinite(n)) nums.push(n);
  });
  if (!nums.length) return p;
  nums.sort(function(a, b) { return a - b; });
  var cheapest = '$' + nums[0].toFixed(2);
  var mostExp = '$' + nums[nums.length - 1].toFixed(2);
  p.price = nums.length > 1 ? cheapest + ' – ' + mostExp : cheapest;
  return p;
}

function removePriceListRowsForDeletions(allProducts) {
  _priceListRows = _priceListRows.filter(function(row) {
    var rowName = normName(row.product);
    var rowSize = normSize(row.size);
    var matchedId = null;
    allProducts.forEach(function(p) {
      if (matchedId) return;
      var base = normName(p.name);
      var keys = [base];
      if (ALIASES[base]) keys.push(ALIASES[base]);
      keys.forEach(function(k) {
        if (k === rowName || rowName.includes(k) || k.includes(rowName)) matchedId = p.id;
      });
    });
    if (matchedId && _deletions.products[matchedId]) return false;
    var sizeDeleted = Object.keys(_deletions.sizes).some(function(key) {
      var parts = key.split('::');
      return parts[0] === matchedId && normSize(parts[1]) === rowSize;
    });
    return !sizeDeleted;
  });
}

function deleteCard(productId, productName) {
  if (!confirm('Remove "' + productName + '" from the US Warehouse grid and price list?\n\nThe product will be hidden (not permanently erased).')) return;
  _deletions.products[productId] = true;
  document.querySelectorAll('#table-body tr[data-productid="' + productId + '"]').forEach(function(row) {
    row.classList.add('deleted-row');
  });
  updateChangesLabel();
}

function deleteSize(key, productName, size) {
  if (!confirm('Remove ' + size + ' from "' + productName + '"?')) return;
  _deletions.sizes[key] = true;
  var input = document.querySelector('.price-input[data-key="' + key.replace(/"/g, '\\"') + '"]');
  if (input) input.closest('tr').classList.add('deleted-row');
  updateChangesLabel();
}

function buildPcIndex(pc) {
  _pcBySiteName = {};
  function numSort(a,b){ return (parseFloat(a.size)||0)-(parseFloat(b.size)||0); }
  pc.forEach(function(entry) {
    if (!entry.allVendors || !entry.allVendors.length) return;
    var best = entry.allVendors[0];
    var cost = parseFloat((best.price||'').replace(/[^0-9.]/g,''));
    var specStr = (entry.spec||'').trim();
    var vialMatch = specStr.match(/\*(\d+)vial/i);
    var vialCount = vialMatch ? parseInt(vialMatch[1]) : 10;
    var sizeData = {
      cat_no: (entry.cat_no||'').trim(),
      spec: specStr,
      size: specStr.split('*')[0].trim(),
      cost: cost || null,
      costPerVial: cost ? cost / vialCount : null,
      vialCount: vialCount,
      vendor: (best.vendor||'').trim()
    };
    var names = entry.site_names || [entry.name];
    names.forEach(function(sn) {
      sn = sn.trim();
      if (!_pcBySiteName[sn]) _pcBySiteName[sn] = [];
      _pcBySiteName[sn].push(sizeData);
    });
  });
  // Sort sizes numerically for each product
  Object.keys(_pcBySiteName).forEach(function(k){ _pcBySiteName[k].sort(numSort); });
}

function dedupePcSizes(pcSizes, p) {
  var catalogNos = p.catalogNos || {};
  var seen = {};
  var out = [];
  pcSizes.forEach(function(s) {
    var k = normSize(s.size);
    if (!seen[k]) {
      seen[k] = s;
      out.push(s);
      return;
    }
    var want = catalogNos[s.size];
    var prev = seen[k];
    if (want && s.cat_no === want && prev.cat_no !== want) {
      var idx = out.indexOf(prev);
      out[idx] = s;
      seen[k] = s;
    }
  });
  return out;
}

function getSizes(p) {
  var pcSizes = dedupePcSizes(_pcBySiteName[p.name] || [], p);
  var catalogNos = p.catalogNos || {};
  var vialSizes = p.vialSizes || [];

  function rowForSize(sz, match) {
    return {
      cat_no: match ? match.cat_no : (catalogNos[sz] || ''),
      size: sz,
      cost: match ? match.cost : null,
      costPerVial: match ? match.costPerVial : null,
      vialCount: match ? match.vialCount : null,
      vendor: match ? match.vendor : null,
      key: p.id + '::' + sz
    };
  }

  function findPcSize(sz) {
    var wantCat = catalogNos[sz];
    var match = null;
    pcSizes.forEach(function(s) {
      if (normSize(s.size) !== normSize(sz)) return;
      if (!match) match = s;
      if (wantCat && s.cat_no === wantCat) match = s;
    });
    return match;
  }

  if (vialSizes.length) {
    return vialSizes.map(function(sz) { return rowForSize(sz, findPcSize(sz)); });
  }
  if (pcSizes.length) {
    return pcSizes.map(function(s) { return rowForSize(s.size, s); });
  }
  return [];
}

function getOriginalPrice(p, size) {
  // Try to find existing price for this size from p.prices or p.price
  if (p.prices && p.prices[size] !== undefined) return p.prices[size];
  // If only one size, use p.price
  var sizes = getSizes(p);
  if (sizes.length === 1) return p.price || '';
  return '';
}

function doLogin() {
  var pw = document.getElementById('pw-input').value.trim();
  if (!pw) return;
  var tokenField = document.getElementById('token-input').value.trim();
  if (tokenField) GITHUB_TOKEN = tokenField;
  else GITHUB_TOKEN = localStorage.getItem('pep_gh_token') || '';
  if (!GITHUB_TOKEN) {
    document.getElementById('login-error').style.display = 'block';
    document.getElementById('login-error').textContent = 'GitHub token required.';
    return;
  }
  if (document.getElementById('remember-me').checked) {
    localStorage.setItem('pep_admin_pw', pw);
    localStorage.setItem('pep_gh_token', GITHUB_TOKEN);
  } else {
    localStorage.removeItem('pep_admin_pw');
    localStorage.removeItem('pep_gh_token');
  }
  loadData();
}

function clearToken() {
  localStorage.removeItem('pep_gh_token');
  GITHUB_TOKEN = '';
  alert('Token cleared.');
}

document.getElementById('pw-input').addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });

function showStatus(msg, type) {
  var bar = document.getElementById('status-bar');
  bar.innerHTML = msg;
  bar.className = 'status-bar ' + type;
}
function hideStatus(){ document.getElementById('status-bar').className = 'status-bar'; }

function loadData() {
  showStatus('Loading...', 'loading');
  Promise.all([
    fetch(GH_RAW + 'products.json?t=' + Date.now()).then(function(r){ return r.json(); }),
    fetch(GH_RAW + 'price-compare.json?t=' + Date.now()).then(function(r){ return r.json(); }),
    ghGetFile('products.json'),
    ghGetFile(PRICE_LIST_FILE),
    fetch(GH_RAW + PRICE_LIST_FILE + '?t=' + Date.now()).then(function(r){ return r.text(); })
  ])
  .then(function(results) {
    _products = results[0].filter(function(p) {
      return p.visible && p.warehouse === 'US Warehouse';
    });
    buildPcIndex(results[1]);
    _sha = results[2].sha;
    _priceListSha = results[3].sha;
    parsePriceListHtml(results[4]);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'block';
    document.getElementById('product-count').textContent = _products.length + ' US Warehouse products';
    hideStatus();
    renderTable();
  })
  .catch(function(e){
    var el = document.getElementById('login-error');
    el.style.display = 'block';
    el.textContent = 'Load failed: ' + e.message;
    hideStatus();
  });
}

function catBadge(cat) {
  var map = {'Weight Management':'badge-weight','Hormone Support':'badge-gh','Recovery & Healing':'badge-healing','Peptide Blends':'badge-blends','Other Research':'badge-other'};
  return '<span class="badge ' + (map[cat]||'badge-other') + '">' + esc(cat) + '</span>';
}
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }
function jsStr(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n'); }

function renderTable() {
  var tbody = document.getElementById('table-body');
  tbody.innerHTML = '';

  _products.forEach(function(p) {
    var sizes = getSizes(p);
    var isFirstSize = true;

    sizes.forEach(function(s) {
      var key = s.key;
      var origPrice = getOriginalPrice(p, s.size);
      var currentPrice = _changes[key] !== undefined ? _changes[key] : origPrice;
      var isChanged = _changes[key] !== undefined;

      var tr = document.createElement('tr');
      tr.className = 'size-row' + (isChanged ? ' changed-row' : '');
      tr.dataset.name = (p.name + ' ' + s.cat_no).toLowerCase();
      tr.dataset.category = (p.category||'').toLowerCase();
      tr.dataset.productid = p.id;
      tr.dataset.sizekey = key;

      if (_deletions.products[p.id] || _deletions.sizes[key]) tr.classList.add('deleted-row');

      tr.innerHTML =
        '<td>' + (isFirstSize ? '<strong>' + esc(p.name) + '</strong>' : '') + '</td>' +
        '<td style="font-size:12px;font-weight:600">' + esc(s.size) + '</td>' +
        '<td class="catno-cell">' + esc(s.cat_no) + '</td>' +
        (isFirstSize ? '<td>' + catBadge(p.category) + '</td>' : '<td></td>') +
        '<td class="vendor-cell">' + (s.vendor ? esc(s.vendor) : '<span style="color:#ddd">—</span>') + '</td>' +
        '<td class="cost-cell">' + (s.cost != null ? '$' + s.cost.toFixed(2) : '<span style="color:#ddd">—</span>') + '</td>' +
        '<td class="cost-cell">' + (s.costPerVial != null ? '$' + s.costPerVial.toFixed(2) : '<span style="color:#ddd">—</span>') + '</td>' +
        '<td><input class="price-input' + (isChanged?' changed':'') + '" type="text" value="' + escAttr(currentPrice) + '" ' +
          'data-key="' + escAttr(key) + '" data-cost="' + (s.cost||'') + '" data-costpervial="' + (s.costPerVial||'') + '" data-original="' + escAttr(origPrice) + '" ' +
          'oninput="onPriceChange(this)"></td>' +
        (isFirstSize ?
          '<td><input type="checkbox"' + (p.inStock?' checked':'') + ' data-id="' + escAttr(p.id) + '" onchange="onStockChange(this)" style="width:16px;height:16px;cursor:pointer;accent-color:var(--teal)"></td>' :
          '<td></td>') +
        '<td style="white-space:nowrap">' +
          (isFirstSize ? '<button type="button" class="btn-icon card-del" title="Delete card" onclick="deleteCard(\'' + jsStr(p.id) + '\',\'' + jsStr(p.name) + '\')">🗑 Card</button> ' : '') +
          '<button type="button" class="btn-icon" title="Delete size" onclick="deleteSize(\'' + jsStr(key) + '\',\'' + jsStr(p.name) + '\',\'' + jsStr(s.size) + '\')">×</button>' +
        '</td>';

      tbody.appendChild(tr);
      isFirstSize = false;
    });
  });

  filterTable();
}

function onPriceChange(input) {
  var key = input.dataset.key;
  var val = input.value.trim();
  if (val !== input.dataset.original) {
    _changes[key] = val;
    input.classList.add('changed');
    input.closest('tr').classList.add('changed-row');
  } else {
    delete _changes[key];
    input.classList.remove('changed');
    input.closest('tr').classList.remove('changed-row');
  }
  updateChangesLabel();
}

function onStockChange(cb) {
  var id = cb.dataset.id;
  _changes['_stock_::' + id] = cb.checked;
  updateChangesLabel();
}

function applyGlobalMarkup() {
  var pct = parseFloat(document.getElementById('global-markup').value);
  if (isNaN(pct)) { alert('Enter a markup % first'); return; }
  var mult = 1 + pct / 100;
  var applied = 0;
  document.querySelectorAll('#table-body tr.size-row').forEach(function(row) {
    if (row.style.display === 'none') return;
    var input = row.querySelector('.price-input');
    if (!input) return;
    var cost = parseFloat(input.dataset.costpervial);
    if (!cost) return;
    input.value = '$' + (cost * mult).toFixed(2);
    onPriceChange(input);
    applied++;
  });
  showStatus('✅ Applied ' + pct + '% markup to ' + applied + ' sizes with cost data.', 'success');
}

function resetAll() {
  if (!confirm('Reset all pending changes and deletions?')) return;
  _changes = {};
  _deletions = { products: {}, sizes: {} };
  document.querySelectorAll('.price-input').forEach(function(input){
    input.value = input.dataset.original;
    input.classList.remove('changed');
    input.closest('tr').classList.remove('changed-row');
  });
  document.querySelectorAll('#table-body tr.deleted-row').forEach(function(row) {
    row.classList.remove('deleted-row');
  });
  updateChangesLabel();
}

function updateChangesLabel() {
  var priceCount = Object.keys(_changes).length;
  var delCount = Object.keys(_deletions.products).length + Object.keys(_deletions.sizes).length;
  var count = priceCount + delCount;
  var label = document.getElementById('changes-label');
  var parts = [];
  if (priceCount) parts.push(priceCount + ' price');
  if (delCount) parts.push(delCount + ' deletion');
  label.textContent = count > 0 ? parts.join(', ') + (count === 1 ? '' : 's') + ' pending' : 'No changes';
  label.style.color = count > 0 ? '#f0a500' : '#6b7f94';
  var pb = document.getElementById('push-bar');
  if (count > 0) { pb.classList.add('show'); document.getElementById('push-summary').textContent = count + ' pending change' + (count===1?'':'s') + ' ready to push'; }
  else { pb.classList.remove('show'); }
}

function filterTable() {
  var search = document.getElementById('search-box').value.toLowerCase();
  var cat = document.getElementById('category-filter').value.toLowerCase();
  document.querySelectorAll('#table-body tr.size-row').forEach(function(row){
    var show = (!search || row.dataset.name.includes(search)) &&
               (!cat || row.dataset.category === cat);
    row.style.display = show ? '' : 'none';
  });
}

function pushToGitHub() {
  var pending = Object.keys(_changes).length + Object.keys(_deletions.products).length + Object.keys(_deletions.sizes).length;
  if (!pending) return;
  document.querySelector('#push-bar .btn').disabled = true;
  showStatus('⏳ Pushing...', 'loading');

  // Build updated products: collect per-size prices
  var updated = _products.map(function(p) {
    var out = applySizeDeletions(Object.assign({}, p));
    // Apply stock changes
    if (_changes['_stock_::' + p.id] !== undefined) out.inStock = _changes['_stock_::' + p.id];

    // Collect size prices
    var sizes = getSizes(p).filter(function(s) { return !_deletions.sizes[s.key]; });
    var newPrices = Object.assign({}, out.prices || {});
    var allPrices = [];
    sizes.forEach(function(s) {
      var key = s.key;
      var val = _changes[key] !== undefined ? _changes[key] : getOriginalPrice(p, s.size);
      if (val) {
        newPrices[s.size] = val;
        var num = parseFloat(val.replace(/[^0-9.]/g,''));
        if (num) allPrices.push(num);
      }
    });

    if (Object.keys(newPrices).length) {
      out.prices = newPrices;
      if (allPrices.length) {
        allPrices.sort(function(a,b){return a-b;});
        var cheapest = '$' + allPrices[0].toFixed(2);
        var mostExp = '$' + allPrices[allPrices.length-1].toFixed(2);
        out.price = allPrices.length > 1 ? cheapest + ' – ' + mostExp : cheapest;
      }
    }
    return recalcProductPriceRange(out);
  });

  // Merge US Warehouse edits into full products.json
  var updatedById = {};
  updated.forEach(function(p) { updatedById[p.id] = p; });

  ghGetFile('products.json')
  .then(function(meta) {
    return fetch(GH_RAW + 'products.json?t=' + Date.now()).then(function(r){ return r.json(); }).then(function(all) {
      var merged = all.map(function(p) {
        if (_deletions.products[p.id]) {
          return Object.assign({}, p, { visible: false });
        }
        var sizeOnly = applySizeDeletions(p);
        if (updatedById[p.id]) {
          return Object.assign({}, sizeOnly, updatedById[p.id]);
        }
        if (Object.keys(_deletions.sizes).some(function(k) { return k.split('::')[0] === p.id; })) {
          return recalcProductPriceRange(sizeOnly);
        }
        return p;
      });
      return ghPutFile('products.json', JSON.stringify(merged, null, 2), 'Update US Warehouse prices from admin', meta.sha)
        .then(function(result) {
          if (!result.content) throw new Error('products.json: ' + JSON.stringify(result));
          return merged;
        });
    });
  })
  .then(function(mergedProducts) {
    removePriceListRowsForDeletions(mergedProducts);
    var listUpdates = syncPriceListFromProducts(mergedProducts.filter(function(p) {
      return p.visible && p.warehouse === 'US Warehouse';
    }));
    var listHtml = buildPriceListHtml();
    return ghPutFile(
      PRICE_LIST_FILE,
      listHtml,
      'Sync Peptide Price List US prices from admin (' + listUpdates + ' rows)',
      _priceListSha
    ).then(function(result) {
      if (!result.content) throw new Error(PRICE_LIST_FILE + ': ' + JSON.stringify(result));
      if (result.content.sha) _priceListSha = result.content.sha;
      return { mergedProducts: mergedProducts, listUpdates: listUpdates };
    });
  })
  .then(function(result) {
    _products = result.mergedProducts.filter(function(p) {
      return p.visible && p.warehouse === 'US Warehouse';
    });
    _changes = {};
    _deletions = { products: {}, sizes: {} };
    updateChangesLabel();
    renderTable();
    var msg = '✅ Pushed! US Warehouse + price list update in ~30 seconds.';
    if (result.listUpdates) msg += ' (' + result.listUpdates + ' price list rows synced)';
    showStatus(msg, 'success');
    document.querySelector('#push-bar .btn').disabled = false;
  })
  .catch(function(e){
    showStatus('❌ Error: ' + e.message, 'error');
    document.querySelector('#push-bar .btn').disabled = false;
  });
}

  var savedPw = localStorage.getItem('pep_admin_pw');
  var savedToken = localStorage.getItem('pep_gh_token');
  if (savedToken) document.getElementById('token-input').value = savedToken;
  if (savedPw && savedToken) {
    document.getElementById('pw-input').value = savedPw;

    GITHUB_TOKEN = savedToken;
    loadData();
  }
