<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="520" viewBox="0 0 1900 520">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&amp;family=Open+Sans:wght@400&amp;display=swap');
      .heading { font-family: 'Montserrat', Arial, sans-serif; font-weight: 700; fill: #0D1B2A; }
      .semi { font-family: 'Montserrat', Arial, sans-serif; font-weight: 600; fill: #0D1B2A; }
      .body { font-family: 'Open Sans', Arial, sans-serif; fill: #0D1B2A; }
      .teal { fill: #0EA5A5; }
      .white { fill: #FFFFFF; }
      .navy { fill: #0D1B2A; }
      .light { fill: #F5F7FA; }
    </style>
    <pattern id="honeycomb" width="28" height="24" patternUnits="userSpaceOnUse">
      <path d="M14 2 L26 9 L26 15 L14 22 L2 15 L2 9 Z" fill="none" stroke="#0D1B2A" stroke-width="1" opacity="0.05"/>
    </pattern>
  </defs>

  <!-- FRONT LABEL 375 x 450 (1.25" x 1.50" @300dpi) -->
  <g id="front-label" transform="translate(20,20)">
    <g id="locked-elements">
      <rect width="375" height="450" class="light" stroke="#0D1B2A" stroke-width="2"/>
      <rect width="375" height="450" fill="url(#honeycomb)"/>
      <circle cx="187.5" cy="52" r="30" fill="none" stroke="#0EA5A5" stroke-width="2"/>
      <polygon points="187.5,28 207,38 207,58 187.5,68 168,58 168,38" fill="none" stroke="#0D1B2A" stroke-width="1"/>
      <text x="187.5" y="58" text-anchor="middle" class="heading" font-size="16">PS</text>
      <text x="187.5" y="86" text-anchor="middle" class="semi" font-size="11">PEP SUPPLIERS</text>
      <line x1="161" y1="96" x2="214" y2="96" stroke="#0EA5A5" stroke-width="2"/>
      <text x="187.5" y="248" text-anchor="middle" class="body" font-size="9">RESEARCH USE ONLY / NOT FOR HUMAN CONSUMPTION</text>
      <rect y="414" width="375" height="36" class="navy"/>
    </g>
    <g id="editable-fields">
      <text id="peptide-name" x="187.5" y="145" text-anchor="middle" class="heading" font-size="28">{{PEPTIDE_NAME}}</text>
      <rect id="mg-badge-bg" x="142" y="160" width="90" height="28" rx="5" fill="#0EA5A5"/>
      <text id="mg-badge-text" x="187.5" y="180" text-anchor="middle" class="heading white" font-size="16">{{MG}}</text>
      <text id="lot-front" x="120" y="436" text-anchor="middle" class="white body" font-size="10">LOT: {{LOT}}</text>
      <text x="187.5" y="436" text-anchor="middle" class="white body" font-size="10">|</text>
      <text id="batch-front" x="255" y="436" text-anchor="middle" class="white body" font-size="10">BATCH: {{BATCH}}</text>
    </g>
  </g>

  <!-- BACK LABEL 375 x 450 -->
  <g id="back-label" transform="translate(430,20)">
    <g id="locked-elements-back">
      <rect width="375" height="450" class="light" stroke="#0D1B2A" stroke-width="2"/>
      <rect width="375" height="450" fill="url(#honeycomb)"/>
      <text x="187.5" y="36" text-anchor="middle" class="teal heading" font-size="16">PRODUCT INFORMATION</text>
      <line x1="120" y1="44" x2="255" y2="44" stroke="#0EA5A5" stroke-width="2"/>
      <text x="30" y="78" class="body" font-size="12">• Purity: &gt;99% (HPLC)</text>
      <text x="30" y="102" class="body" font-size="12">• Molecular Weight: N/A</text>
      <text x="30" y="126" class="body" font-size="12">• Sequence: N/A</text>
      <text x="30" y="150" class="body" font-size="12">• Storage: 2-8°C</text>
      <text x="30" y="174" class="body" font-size="12">• Lyophilized Powder</text>
      <text x="30" y="198" class="body" font-size="12">• For Research Use Only</text>
      <text x="150" y="360" class="heading" font-size="12">SCAN FOR COA &amp; MORE</text>
      <text id="website" x="150" y="380" class="teal body" font-size="12">PEPSUPPLIERS.COM</text>
      <rect y="414" width="375" height="36" class="navy"/>
    </g>
    <g id="editable-fields-back">
      <rect id="qr-placeholder" x="30" y="320" width="60" height="60" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="1"/>
      <text x="60" y="355" text-anchor="middle" class="body" font-size="9">{{QR}}</text>
      <text id="lot-back" x="120" y="436" text-anchor="middle" class="white body" font-size="10">LOT: {{LOT}}</text>
      <text x="187.5" y="436" text-anchor="middle" class="white body" font-size="10">|</text>
      <text id="batch-back" x="255" y="436" text-anchor="middle" class="white body" font-size="10">BATCH: {{BATCH}}</text>
    </g>
  </g>

  <!-- CAP STICKER 188px diameter (0.625") -->
  <g id="cap-sticker" transform="translate(860,20)">
    <g id="locked-elements-cap">
      <circle cx="94" cy="94" r="94" class="navy"/>
      <circle cx="94" cy="94" r="88" fill="none" stroke="#0EA5A5" stroke-width="2"/>
      <circle cx="94" cy="72" r="22" fill="none" stroke="#0EA5A5" stroke-width="2"/>
      <polygon points="94,56 106,62 106,74 94,80 82,74 82,62" fill="none" stroke="#FFFFFF" stroke-width="1"/>
      <text x="94" y="78" text-anchor="middle" class="heading white" font-size="14">PS</text>
      <text x="94" y="102" text-anchor="middle" class="white semi" font-size="8">PEP SUPPLIERS</text>
      <path id="cap-ring-text" d="M 94 18 A 76 76 0 1 1 93.9 18" fill="none"/>
      <text class="teal body" font-size="8" letter-spacing="1">
        <textPath href="#cap-ring-text" startOffset="12%">QUALITY · PURITY · TRUST</textPath>
      </text>
    </g>
  </g>

  <!-- TAMPER SEAL 150 x 450 (0.50" x 1.50") -->
  <g id="tamper-seal" transform="translate(1090,20)">
    <g id="locked-elements-tamper">
      <rect width="150" height="450" rx="4" class="navy"/>
      <circle cx="75" cy="70" r="20" fill="none" stroke="#0EA5A5" stroke-width="2"/>
      <text x="75" y="76" text-anchor="middle" class="heading white" font-size="12">PS</text>
      <text x="75" y="108" text-anchor="middle" class="white semi" font-size="8">PEP SUPPLIERS</text>
      <rect x="57" y="190" width="36" height="28" rx="2" fill="none" stroke="#0EA5A5" stroke-width="2"/>
      <path d="M63 190 v-8 a12 6 0 0 1 24 0 v8" fill="none" stroke="#0EA5A5" stroke-width="2"/>
      <text x="75" y="420" text-anchor="middle" class="white body" font-size="8">
        <tspan x="75" dy="0">SEALED FOR</tspan>
        <tspan x="75" dy="12">YOUR</tspan>
        <tspan x="75" dy="12">PROTECTION</tspan>
      </text>
    </g>
  </g>
</svg>
